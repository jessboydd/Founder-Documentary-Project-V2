<!DOCTYPE html>
<title>Ask the Bear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; start screen is loud, the chat is calm */
:root{
  --lavender:#B997F8; --orange:#FF7044; --ink:#231930; --muted:#665D70;
  --surface:#F8F4FC; --tint:#F0EAF8; --line:#E8E2F0; --white:#FFFFFF;
  --link:#6B44C2; --stop:#C42B3C; --soon:#F2B705; --info:#2E7D4F;
  --display:"Roboto Condensed","Arial Narrow",sans-serif;
  --body:Figtree,Aptos,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:16px 0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px;font:800 20px/1 var(--display);text-transform:uppercase}
.brand svg{width:36px;height:36px;flex:none}
.round{width:48px;height:48px;border-radius:999px;border:2px solid var(--ink);background:var(--white);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.round svg{width:22px;height:22px}
h1{margin:0;font:800 40px/1 var(--display);text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.label{font:700 13px/16px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:20px}
.btn{min-height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--white);display:flex;align-items:center;justify-content:center;gap:10px;font:800 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;padding:10px 16px;width:100%;text-align:center}
.btn.lav{background:var(--lavender)}
.btn svg{width:22px;height:22px;flex:none}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button,.quick button{min-height:44px;border-radius:999px;border:2px solid var(--ink);background:var(--white);padding:0 14px;font-weight:600;font-size:15px;cursor:pointer}
.topics button:hover,.quick button:hover{background:var(--tint)}
details.lightsbox{background:var(--white);border-radius:20px;padding:4px 16px}
details.lightsbox summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:700;list-style:none}
details.lightsbox summary::-webkit-details-marker{display:none}
details.lightsbox[open] summary span:last-child{transform:rotate(180deg)}
.lights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:16px}
.light{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer;text-align:left}
.light:hover{border-color:var(--ink)}
.light .sym{width:44px;height:44px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center}.light .sym svg{width:30px;height:30px}.lvl{padding:4px 0 2px}
.light b{font-size:14px;line-height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px 4px 6px;font:800 12px/16px var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.stop{background:var(--stop);color:var(--white)}
.chip.soon{background:var(--soon);color:var(--ink)}
.chip.info{background:var(--info);color:var(--white)}
.chip.unsure{background:var(--tint);color:var(--ink)}
.describe{display:flex;gap:8px}
.describe input,.composer input[type=text]{flex:1;min-width:0;height:52px;border-radius:999px;border:2px solid var(--ink);padding:0 16px;background:var(--white)}
.head{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:2;padding-block:8px;display:flex;flex-direction:column;gap:10px;margin-top:-8px}
.headrow{display:flex;align-items:center;gap:12px}
.headrow .t{min-width:0;flex:1}
.headrow .t b{display:block;font:800 20px/1.1 var(--display);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{background:var(--stop);color:var(--white);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.banner .bt{display:flex;align-items:center;gap:10px;font:800 22px/1.1 var(--display);text-transform:uppercase}
.banner .bt svg{width:30px;height:30px;flex:none}
.banner ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:16px;line-height:22px}
.banner p{font-size:14px;line-height:20px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:12px 14px;font-size:16px;line-height:23px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--white);border-radius:20px 20px 20px 6px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-radius:20px 20px 6px 20px}
.msg.me img{display:block;width:100%;max-width:220px;border-radius:12px;margin-bottom:8px}
.msg.think{color:var(--muted);font-style:italic}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.composer{position:sticky;bottom:0;background:var(--surface);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;margin-top:auto}
.composer form{display:flex;gap:8px;align-items:center}
.composer input[type=text]{height:48px}
.send{background:var(--orange)}
.pending{display:flex;align-items:center;gap:8px;font-size:14px}
.pending img{width:44px;height:44px;object-fit:cover;border-radius:10px}
.pending button{border:none;background:none;color:var(--link);font-weight:700;cursor:pointer;min-height:44px;padding:0 8px}
.checker{display:grid;grid-template-columns:repeat(6,10px);grid-template-rows:repeat(2,10px)}
.checker i.k{background:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{font-size:13px;line-height:18px;color:var(--muted);text-align:center}
.err{color:var(--stop);font-weight:600;font-size:15px}
.note{background:var(--tint);border-radius:16px;padding:12px 14px;font-size:15px;line-height:22px}
.spacer{height:8px}
.demo{background:var(--ink);color:var(--surface);border-radius:14px;padding:8px 12px;font-size:13px;line-height:18px;display:flex;gap:8px;align-items:center}
.demo b{font:800 12px/16px var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--orange);color:var(--ink);border-radius:999px;padding:2px 8px;flex:none}
.codebox{background:var(--white);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.codebox form{display:flex;gap:8px}
.codebox input{flex:1;min-width:0;height:48px;border-radius:999px;border:2px solid var(--ink);padding:0 16px;background:var(--white)}
body{margin:0}
.carcard{display:flex;align-items:center;gap:12px;background:var(--white);border:2px solid var(--line);border-radius:20px;padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.carcard:hover{border-color:var(--ink)}
.carico{width:44px;height:44px;border-radius:12px;background:var(--lavender);display:flex;align-items:center;justify-content:center;flex:none}
.carico svg{width:26px;height:26px}
.cartext{display:flex;flex-direction:column;flex:1;min-width:0}
.cartext b{font:800 17px/1.2 var(--display);text-transform:uppercase}
a.btn{text-decoration:none;color:var(--ink)}
.btn.call{background:var(--white);border-color:var(--stop);color:var(--stop)}
.callbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;background:var(--white);color:var(--stop);font:800 17px/1 var(--display);text-transform:uppercase;text-decoration:none}
.callbtn svg{width:22px;height:22px}
.carsec{background:var(--white);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.field span{font-size:15px;white-space:nowrap}
.field input{flex:1;min-width:0;height:44px;border-radius:12px;border:2px solid var(--line);padding:0 12px;background:var(--surface)}
.field input:focus{border-color:var(--ink)}
.field em{font-style:normal;font-weight:700;font-size:14px}
.pair{display:flex;gap:10px}
.pickrow{display:flex;flex-direction:column;gap:6px}
.pickrow>span{font-size:15px}
.topics button.on{background:var(--ink);color:var(--surface)}
</style>

<div class="app" id="app"></div>
<input type="file" id="photo" accept="image/*" capture="environment" hidden>
<input type="file" id="upload" accept="image/*" hidden>

<script>
/* Ask the Bear, Claude version. Built by tools/build-claude-version.py from the
   standalone app in jessboydd/bear-with-me, so both stay the same. */
const LIGHTS = [
  { id: "oil_pressure", name: "Oil pressure", level: "stop",
    looks: "An old-style oil can with a drip. Some cars show it as a screen message, like Oil Pressure Low, with a triangle warning light.",
    facts: "The engine may not be getting enough oil pressure, which can quickly damage it. Pull over when it's safe, turn the engine off, and don't keep driving. Call roadside help or a mechanic." },
  { id: "coolant_temp", name: "Engine temperature", level: "stop",
    looks: "A thermometer standing in wavy lines. Some cars show it as a screen message, like Engine Coolant Temp High.",
    facts: "The engine is overheating. Pull over when it's safe, turn off the A/C, then turn off the engine. If steam is coming from under the hood, stay back and wait until it stops before opening the hood. Never open the radiator or coolant cap while the engine is hot: hot coolant can spray out and burn. Call roadside help or a mechanic before driving again." },
  { id: "battery", name: "Battery / charging", level: "stop",
    looks: "A rectangle battery with a plus and a minus sign. Some cars show a message like Charging System Malfunction.",
    facts: "The charging system isn't working, so the car may stop running. Pull over when it's safe and call for help. Driving on may be dangerous." },
  { id: "brake", name: "Brake warning", level: "stop",
    looks: "The word BRAKE (most US cars), or an exclamation point in a circle between curved brackets.",
    facts: "First make sure the parking brake is fully released. If the light stays on, the brakes may need attention (low brake fluid is a common cause). Pull over carefully when it's safe and call for help. Continuing to drive may be dangerous." },
  { id: "eps", name: "Power steering", level: "stop",
    looks: "A steering wheel with an exclamation point beside it. Often red.",
    facts: "The power steering has a problem, and steering may suddenly feel very heavy. Hold the wheel firmly, pull over when it's safe, and call for help." },
  { id: "check_engine", name: "Check engine", level: "soon",
    looks: "The outline of an engine, often with the word CHECK.",
    facts: "The car found an engine, emissions or transmission control problem. Get it checked right away; many auto parts stores read the code for free. First check two common causes: a loose gas cap (tighten it until it clicks) and an empty tank (fill up). The light can take a few drives to go off. Flashing: treat it like a red light and pull over when it's safe.",
    first: "Okay, the check engine light. Is it steady or flashing? And is the car driving any differently?",
    quick: ["Steady, drives fine", "It's flashing", "Could it be my gas cap?"] },
  { id: "tpms", name: "Low tire pressure", level: "soon", urgent: true,
    looks: "A horseshoe shape (a tire seen from the side) with an exclamation point inside.",
    facts: "One or more tires is low. Stop somewhere safe as soon as you can and check all four with a tire gauge; fill to the number on the sticker inside the driver's door (the PSI under cold tire pressure, not the number on the tire). Avoid hard braking and sharp turns until then. If the light flashes for about a minute when the car starts and then stays on, the sensor system needs a shop. Cold weather can lower tire pressure and turn the light on. With a small spare tire on, the light may stay on; that's expected." },
  { id: "abs", name: "ABS (anti-lock brakes)", level: "soon", urgent: true,
    looks: "The letters ABS (most US cars), sometimes inside a circle between curved brackets.",
    facts: "The anti-lock brake system has a problem. Pull over when it's safe and call for help; driving on may be dangerous. If the red brake light is on too, stop right away." },
  { id: "traction", name: "Traction / stability", level: "soon",
    looks: "A car with two wavy skid lines underneath.",
    facts: "Flashing: traction or stability control is working right now, usually on a slippery road. Ease off the gas and drive gently. Staying on: the system has a problem; have a shop check it. A separate light with the word OFF means the system was turned off with a button." },
  { id: "airbag", name: "Airbag (SRS)", level: "soon",
    looks: "A seated person with a large circle (the airbag) in front of them, or the letters SRS. Red on many cars.",
    facts: "The airbag or seatbelt safety system has a problem, so the airbags may not work in a crash. Get it checked right away by a shop; never try to fix airbag parts yourself.",
    first: "The airbag light means your airbags might not work in a crash, so get it checked right away. Did it come on by itself, or after something happened?",
    quick: ["It came on by itself", "After a bump", "Is it safe to drive?"] },
  { id: "low_fuel", name: "Low fuel", level: "soon",
    looks: "A gas pump.",
    facts: "Time to fill up. How far you can go once the light comes on varies by car, so don't count on it. Running out can leave you stranded somewhere unsafe. Tip: the small arrow next to the fuel gauge's pump symbol points to the side your gas cap is on.",
    first: "Low fuel light: time to find a gas station. Want a tip for which side your gas cap is on?",
    quick: ["Which side is my gas cap?", "How far can I go?"] },
  { id: "service", name: "Service reminder", level: "soon",
    looks: "A wrench, or a screen message like Maintenance Required Soon. Usually amber.",
    facts: "A reminder that an oil change or scheduled service is due, based on time or miles. It's not an emergency: book it soon. Don't confuse it with the red oil pressure light (an oil can) or an Oil Pressure Low message, which mean pull over. Not sure which one it is? Treat it as the red one and check the owner's manual.",
    first: "Sounds like a service reminder. Is it a wrench or a message on the screen, or a red oil can? The red oil can is the urgent one.",
    quick: ["A wrench", "A message on the screen", "A red oil can"] },
  { id: "master_warning", name: "Triangle ! (master warning)", level: "soon",
    looks: "A triangle with an exclamation point, often amber, shown with a message on the screen between the gauges and sometimes a buzzer.",
    facts: "The car is showing a warning message on the screen. Read the message: it says what's wrong. If it says Stop, or to stop in a safe place, pull over when it's safe and call for help. If you can't read it while driving, pull over when it's safe to read it.",
    first: "The triangle means there's a message on your screen. What does the message say?",
    quick: ["It says Stop", "Something about maintenance", "A door is open"] },
  { id: "high_beam", name: "High beams on", level: "info",
    looks: "A blue headlight shape (like a capital D) with straight lines going out to the side.",
    facts: "Your high beams are on. That's fine on dark empty roads. Switch to regular headlights when another car is coming toward you or you're following someone, so you don't blind them. The headlight stalk is usually on the left of the steering wheel: push or pull it to switch.",
    first: "That blue light just means your high beams are on. Nothing is wrong with the car. Want to know how to switch them off?",
    quick: ["How do I turn them off?", "When should I use them?"] },
  { id: "seatbelt", name: "Seatbelt", level: "info",
    looks: "A seated person with a seatbelt across them. Often red.",
    facts: "A reminder to buckle up. It also comes on when a front passenger isn't buckled, and a bag or something heavy on the front seat can set it off. Often red, but it's a reminder, not a car problem.",
    first: "That's the seatbelt reminder. Is everyone buckled? A bag on the front seat can also set it off.",
    quick: ["Everyone's buckled", "There's a bag on the seat"] },
  { id: "door_open", name: "Door open", level: "info",
    looks: "A car seen from above with a door sticking out, or a picture of your car on the screen showing which door is open.",
    facts: "A door or the trunk isn't fully shut. When you're stopped somewhere safe, close each one firmly. Often red, but it's a reminder, not a car problem.",
    first: "A door or the trunk isn't fully shut. When you're stopped, close each one firmly. Did that clear it?",
    quick: ["That fixed it", "It's still on"] }
];


/* ---------- Mode ----------
   Inside Claude: the bear's AI comes from Claude ("sample").
   If Claude's AI isn't available where the page is open, the bear gives demo answers. */
let sample = null, DEMO = true, photosBlocked = false;
const NO_PHOTOS = "Claude doesn't allow photos where this page is open right now. Describe what you see in words instead. (Photos work in the standalone app.)";

const TOPICS = ["A light came on", "Tire looks low or flat", "Something's leaking", "A weird noise", "Smoke or a burning smell", "Car won't start", "Brakes feel off"];
const LEVEL = { stop: "Stop soon", soon: "Check soon", info: "FYI", unsure: "Still figuring out" };

/* ---------- Icons ---------- */
const S = (inner, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const SYM = { // same symbols as the booklet

  coolant_temp: S('<path d="M12 3v10"/><circle cx="12" cy="15" r="2.4" fill="currentColor"/><path d="M12 5h3M12 8h3M12 11h3"/><path d="M3 19c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0M3 22c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/>'),
  battery: S('<rect x="3" y="7" width="18" height="12" rx="1.5"/><path d="M6 7V5h3v2M15 7V5h3v2"/><path d="M6 13h4M14 13h4M16 11v4"/>'),
  brake: S('<text x="12" y="15" font-family="Roboto Condensed, sans-serif" font-size="6.8" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle">BRAKE</text>'),
  check_engine: S('<path d="M2.5 7v5"/><path d="M4.5 6.5h2V5h3V3h5v2h2l2 2h2.5v6.5H19l-2 2H9.5l-2-2h-3z"/><path d="M2.5 9.5h2"/><text x="12" y="22.5" font-family="Roboto Condensed, sans-serif" font-size="6.2" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle">CHECK</text>'),

  tpms: S('<path d="M5.5 5C4 7 3.5 9.5 3.5 12s.8 4.6 2 6h13c1.2-1.4 2-3.5 2-6s-.5-5-2-7"/><path d="M7 21v-3M10.3 21v-3M13.7 21v-3M17 21v-3"/><path d="M12 7v6"/><circle cx="12" cy="15.5" r=".9" fill="currentColor"/>'),
  abs: S('<text x="12" y="15.5" font-family="Roboto Condensed, sans-serif" font-size="10" font-weight="800" fill="currentColor" stroke="none" text-anchor="middle">ABS</text>'),
  traction: S('<path d="M5 13l1.8-5h10.4L19 13v3.5H5z"/><path d="M5 13h14"/><circle cx="8" cy="16.5" r="1.4" fill="currentColor"/><circle cx="16" cy="16.5" r="1.4" fill="currentColor"/><path d="M6 21c1.2-1.4 2-1.4 3 0s1.8 1.4 3 0M13 21c1.2-1.4 2-1.4 3 0s1.8 1.4 3 0"/>'),
  airbag: S('<circle cx="8" cy="4.5" r="2"/><path d="M7 8.5l-1.5 6.5h5l2 6"/><path d="M6 11l4 3"/><circle cx="16.5" cy="10.5" r="4.5" fill="currentColor"/>'),

  service: S('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5a1.5 1.5 0 0 0 2 2l5.8-5.8a4 4 0 0 0 5.4-5.4l-2.4 2.4-2-2z"/>'),

// Symbol colors as they glow on a dashboard
const GLOW = { eps:"#FF5A5F", airbag:"#FF5A5F", oil_pressure:"#FF5A5F", coolant_temp:"#FF5A5F", battery:"#FF5A5F", brake:"#FF5A5F", seatbelt:"#FF5A5F", door_open:"#FF5A5F", high_beam:"#4D8DFF" };
const SHAPE = {
  stop: '<svg viewBox="0 0 28 28" aria-hidden="true"><polygon points="8.2,1 19.8,1 27,8.2 27,19.8 19.8,27 8.2,27 1,19.8 1,8.2" fill="currentColor"/></svg>',
  soon: '<svg viewBox="0 0 28 28" aria-hidden="true"><polygon points="14,2 27,26 1,26" fill="#F2B705" stroke="#231930" stroke-width="2.5" stroke-linejoin="round"/></svg>',

// Inside Claude, browser storage may not last, so the numbers are also kept in
// the viewer's own private Claude storage. Outside Claude this does nothing.
async function connectCarStore() {
  try {
    const use = window.claude?.use;
    if (!use) return;
    const [db, user] = await Promise.all([use("db"), use("user")]);
    const uid = db && user ? await user.id() : null;
    if (!uid) return;
    carDoc = db.doc("data/users/" + uid + "/car");
    const snap = await carDoc.get();
    if (snap.exists) { car = { ...snap.data() }; store.set(CAR_KEY, JSON.stringify(car)); if (st.screen !== "car") render(); }
    else if (Object.keys(car).length) carDoc.set({ ...car }).catch(() => {});
  } catch { carDoc = null; }
}

let photoTarget = "new";
function render() {
  app.innerHTML = st.screen === "chat" ? chat() : st.screen === "car" ? carScreen() : home();
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

  on("snap", pick("new", "photo"));
  on("up", pick("new", "upload"));

  on("openCar", () => { st.screen = "car"; render(); window.scrollTo(0, 0); });
  app.querySelectorAll("[data-car]").forEach(inp => inp.oninput = () => {
    car[inp.dataset.car] = inp.value.trim(); saveCar();

  });
  app.querySelectorAll("[data-carpick]").forEach(b => b.onclick = () => {
    const k = b.dataset.carpick, v = b.dataset.val;
    if (b.dataset.multi) { const a = new Set(car[k] || []); a.has(v) ? a.delete(v) : a.add(v); car[k] = [...a]; }
    else car[k] = car[k] === v ? "" : v;
    saveCar(); render();
  });
  on("home", () => { st.screen = "home"; st.error = ""; st.pending = null; render(); window.scrollTo(0, 0); });
  app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => startLight(byId(b.dataset.pick)));
  app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => start(b.dataset.topic, null));
  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => send(b.dataset.q));
  const df = document.getElementById("descForm");
  if (df) df.onsubmit = e => { e.preventDefault(); const t = document.getElementById("desc").value.trim(); if (t) start(t, null); };
  const cf = document.getElementById("chatForm");
  if (cf) cf.onsubmit = e => { e.preventDefault(); const i = document.getElementById("msg"); const t = i.value.trim(); if (t || st.pending) { i.value = ""; send(t); } };

for (const id of ["photo", "upload"]) {

    else start("", pic);
  };

// Phone photos are large. Shrink to at most 1280 px on the long side as a JPEG
// before sending: faster on a weak signal, and cheaper for the AI to read.
async function shrink(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
  const scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const data = c.toDataURL("image/jpeg", 0.85).split(",")[1];
  return { url, media_type: "image/jpeg", data, file };
}

/* ---------- Conversation ---------- */
function reset() { Object.assign(st, { screen: "chat", turns: [], topic: "", level: "unsure", light: null, quick: [], busy: false, error: "", pending: null }); }

function start(text, pic) {
  reset();
  st.pending = pic;
  send(text);
}

function startLight(l) {
  reset();
  const stop = l.level === "stop" || l.urgent;
  st.light = l; st.topic = l.name; st.level = stop ? "stop" : l.level;
  const first = stop
    ? "Do the steps above first. Once you're stopped somewhere safe, tell me what's happening and I'll help with what comes next."
    : l.first;
  st.turns.push({ role: "assistant", content: first });
  st.quick = stop ? ["I've pulled over", "I'm on the highway", "What could cause this?"] : l.quick;
  render(); window.scrollTo(0, 0);
}

const RANK = { info: 0, unsure: 1, soon: 2, stop: 3 };
function applyMeta({ urgency, topic, suggestions }) {
  // Urgency only goes up on its own; it comes down only on a clear "info" call.
  if (LEVEL[urgency] && (RANK[urgency] >= RANK[st.level] || urgency === "info" || st.level === "unsure")) st.level = urgency;
  if (topic && !st.light) st.topic = topic.slice(0, 40);
  st.quick = (suggestions || []).slice(0, 3);
}

async function send(text) {
  if (st.busy) return;
  const pic = st.pending; st.pending = null;
  let content = text || "";
  if (pic) content = (content ? content + "\n\n" : "") + "[I attached a photo of the problem.]";
  if (!content) return;
  st.turns.push({ role: "user", content, display: text, photoUrl: pic?.url });
  st.busy = true; st.error = ""; st.quick = [];
  const bot = { role: "assistant", content: "", display: pic ? "Taking a look…" : "Thinking…", think: true };
  st.turns.push(bot);
  render();

  try {
    const res = DEMO ? await demoReply(content, !!pic) : await sampleReply(bot, pic);
    bot.content = bot.display = res.text; bot.think = false;
    applyMeta(res);
  } catch (e) {
    st.turns.pop(); st.turns.pop();
    if (pic) st.pending = pic;
    const code = e?.code;
    if (code === "images_unavailable") { photosBlocked = true; st.pending = null; }
    if (code === "not_granted" || code === "sampling_disabled") { sample = null; DEMO = true; }
    st.error = ({
      not_granted: "Claude's AI isn't available here, so the bear is giving demo answers.",
      sampling_disabled: "Claude's AI isn't available on this account, so the bear is giving demo answers.",
      rate_limited: "Too many messages in a row. Wait a minute and try again.",
      image_rejected: "That photo couldn't be read. Try a different one, a little closer.",
      images_unavailable: NO_PHOTOS,
      refused: "I can't help with that one. Try asking another way."
    })[code] || "That didn't go through. Check your signal and try again.";
    if (!st.turns.length) st.screen = "home";
  } finally {
    st.busy = false; render();
  }
}

async function sampleReply(bot, pic) {
  // Only the newest photo goes to the AI; earlier photos are covered by the bear's own descriptions.
  const history = st.turns.filter(t => t !== bot).slice(-14).map(t => ({ role: t.role, content: t.content }));
  const input = [{ role: "user", content: rules(st.light, carForBear()) }];
  if (history[0]?.role === "assistant") input.push({ role: "user", content: "(I opened the chat.)" });
  input.push(...history);
  const opts = { cache: false, onText: ({ text }) => {
    const v = text.split(META)[0].replace(/\n\s*(U|UR|URG\w*|T|TO|TOP\w*|S|SU|SUG\w*)$/i, "").trim();
    if (!v) return;
    bot.display = v; bot.think = false;
    const el = document.getElementById("chatlog")?.lastElementChild;
    if (el) { el.textContent = v; el.classList.remove("think"); window.scrollTo(0, document.body.scrollHeight); }
  } };
  if (pic) opts.images = [pic.file];
  const { text: full } = await sample(input, opts);
  return parse(full);
}


// The driver's own saved numbers (from their door sticker and manual). Phone
// numbers and insurance are never sent here; they stay on the phone.
function carNote(car) {
  if (!car || typeof car !== "object") return "";
  const clean = k => String(car[k] ?? "").replace(/[\r\n]/g, " ").slice(0, 60).trim();
  const lines = [];
  if (clean("model")) lines.push(`Car: ${clean("model")}`);
  if (clean("front") || clean("rear")) lines.push(`Tire pressure from their door sticker: front ${clean("front") || "not saved"} PSI, rear ${clean("rear") || "not saved"} PSI`);
  if (clean("spare")) lines.push(`Spare tire pressure: ${clean("spare")} PSI`);
  if (clean("spareKit")) lines.push(`Car has: ${clean("spareKit")} (a spare / inflator kit / neither)`);
  if (clean("oilType")) lines.push(`Oil type from their manual: ${clean("oilType")}`);
  if (clean("oilCheck")) lines.push(`Their manual says check oil: ${clean("oilCheck")}`);
  return lines.length ? `\nThe driver saved these numbers for their own car in the app. Use them when they help, and treat them as theirs (don't second-guess them):\n- ${lines.join("\n- ")}\n` : "";
}

function rules(light, car) {
  return `You are "the bear", the friendly guide inside Bear With Me: The Ready Kit, a car-preparedness kit for beginners (mostly women 18-40 who are new to car care). You help with ANY car problem: warning lights, tires, leaks, noises, smells, smoke, dents and damage, fluids, batteries, brakes, things that won't start or won't work. The driver may send photos and will describe what's happening. Your job: understand the problem, judge how urgent it is, explain it in plain words, and give a safe next step.
${carNote(car)}${light ? `\nThe driver picked this dashboard light from a verified list: ${light.name}. Verified facts (trust these over your own knowledge): ${light.facts}\n` : ""}
Their kit has: a tire pressure gauge, a small flashlight, a pen, a document sleeve with registration and insurance, and an illustrated pocket booklet. Page 2 of the booklet has their own car's numbers: tire pressure, oil type, roadside help phone number and insurance.

How to help:
- When they first send a photo, start by saying briefly what you can actually see, and ask if that's right. Never pretend to see details you can't. If the photo is unclear, say so and ask for another angle, more light, or a description.
- Work it out like a calm, knowledgeable friend: ask ONE clarifying question at a time (when it started, steady or flashing, color and smell of a leak, when the noise happens, how the car drives).
- Talk about likely causes as possibilities ("this could be..."), never a certain diagnosis. You can't hear sounds or smell: ask them to describe.
- Only suggest beginner-safe steps: looking, checking tire pressure, checking fluid levels with the engine off and cool, tightening a gas cap, reading the owner's manual. Anything involving brakes, steering, airbags, fuel leaks, electrical work, getting under the car, or lifting it goes to a mechanic or roadside help.
- Never: open a hot radiator or coolant cap, work under a car held up only by a jack, touch a cracked, leaking or hissing battery, or guess at specs; point them to the owner's manual, the door sticker, or page 2 of their booklet for numbers.
- Never say it's fine to keep driving with: a red warning light, a flashing check engine light, overheating, steam or smoke, a burning or fuel smell, brake problems (grinding, soft or sinking pedal, pulling hard), steering problems, a flat or badly damaged tire, or fluid pouring out.
- Many cars show warnings as a message on the screen between the gauges, with a triangle ! light. If they mention a triangle or a message, ask what the message says; if it says Stop or to stop in a safe place, treat it as stop.
- Emergencies first: smoke, fire, fuel smell, a crash, being stuck in traffic lanes, feeling unsafe, or someone hurt means: get to safety and call 911 before anything else.
- If they seem to be driving, tell them to wait until they're parked.
- If the question isn't about a car, gently bring it back.

Style: plain words, no jargon (explain any car word you must use), no markdown symbols. Two to five short sentences; numbered steps only when giving 2-4 steps. Warm, encouraging, lightly playful when the situation is minor; calm and direct with no jokes when it's serious. End with one clear next step or one question.

After your message, add exactly these three lines, in this order, and nothing after them:
URGENCY: stop | soon | info | unsure
TOPIC: a 2-5 word name for the problem
SUGGESTIONS: 2-3 short replies the driver might tap, separated by " | " (max 6 words each)
URGENCY meanings: stop = pull over / don't drive / get help now; soon = get it looked at in the next few days; info = no problem or routine; unsure = not enough information yet.`;
}

const META = /\n\s*(URGENCY|TOPIC|SUGGESTIONS)\s*:/i;
function parse(full) {
  const text = full.split(META)[0].trim() || "Sorry, I lost my train of thought. Could you say that again?";
  const get = key => (full.match(new RegExp(`^\\s*${key}\\s*:\\s*(.+)$`, "im")) || [])[1]?.trim() || "";
  return {
    text,
    urgency: get("URGENCY").toLowerCase().split(/[^a-z]/)[0],
    topic: get("TOPIC"),
    suggestions: get("SUGGESTIONS").split("|").map(s => s.trim()).filter(Boolean).slice(0, 3)
  };
}
