<title>Ask the Bear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; start screen is loud, the chat is calm */
:root{
  --lavender:#B997F8; --orange:#FF7044; --ink:#231930; --muted:#665D70;
  --surface:#F8F4FC; --tint:#F0EAF8; --line:#E8E2F0; --white:#FFFFFF;
  --link:#6B44C2; --stop:#C42B3C; --soon:#F2B705; --info:#2E7D4F;
  --display:"Roboto Condensed","Arial Narrow",sans-serif;
  --body:Figtree,Aptos,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:16px 0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px;font:800 20px/1 var(--display);text-transform:uppercase}
.brand svg{width:36px;height:36px;flex:none}
.round{width:48px;height:48px;border-radius:999px;border:2px solid var(--ink);background:var(--white);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.round svg{width:22px;height:22px}
h1{margin:0;font:800 40px/1 var(--display);text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.label{font:700 13px/16px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:20px}
.btn{min-height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--white);display:flex;align-items:center;justify-content:center;gap:10px;font:800 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;padding:10px 16px;width:100%;text-align:center}
.btn.lav{background:var(--lavender)}
.btn svg{width:22px;height:22px;flex:none}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button,.quick button{min-height:44px;border-radius:999px;border:2px solid var(--ink);background:var(--white);padding:0 14px;font-weight:600;font-size:15px;cursor:pointer}
.topics button:hover,.quick button:hover{background:var(--tint)}
details.lightsbox{background:var(--white);border-radius:20px;padding:4px 16px}
details.lightsbox summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:700;list-style:none}
details.lightsbox summary::-webkit-details-marker{display:none}
details.lightsbox[open] summary span:last-child{transform:rotate(180deg)}
.lights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:16px}
.light{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer;text-align:left}
.light:hover{border-color:var(--ink)}
.light .sym{width:36px;height:36px}
.light b{font-size:14px;line-height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px 4px 6px;font:800 12px/16px var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.stop{background:var(--stop);color:var(--white)}
.chip.soon{background:var(--soon);color:var(--ink)}
.chip.info{background:var(--info);color:var(--white)}
.chip.unsure{background:var(--tint);color:var(--ink)}
.describe{display:flex;gap:8px}
.describe input,.composer input[type=text]{flex:1;min-width:0;height:52px;border-radius:999px;border:2px solid var(--ink);padding:0 16px;background:var(--white)}
.head{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:2;padding-block:8px;display:flex;flex-direction:column;gap:10px;margin-top:-8px}
.headrow{display:flex;align-items:center;gap:12px}
.headrow .t{min-width:0;flex:1}
.headrow .t b{display:block;font:800 20px/1.1 var(--display);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{background:var(--stop);color:var(--white);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.banner .bt{display:flex;align-items:center;gap:10px;font:800 22px/1.1 var(--display);text-transform:uppercase}
.banner .bt svg{width:30px;height:30px;flex:none}
.banner ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:16px;line-height:22px}
.banner p{font-size:14px;line-height:20px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:12px 14px;font-size:16px;line-height:23px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--white);border-radius:20px 20px 20px 6px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-radius:20px 20px 6px 20px}
.msg.me img{display:block;width:100%;max-width:220px;border-radius:12px;margin-bottom:8px}
.msg.think{color:var(--muted);font-style:italic}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.composer{position:sticky;bottom:0;background:var(--surface);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;margin-top:auto}
.composer form{display:flex;gap:8px;align-items:center}
.composer input[type=text]{height:48px}
.send{background:var(--orange)}
.pending{display:flex;align-items:center;gap:8px;font-size:14px}
.pending img{width:44px;height:44px;object-fit:cover;border-radius:10px}
.pending button{border:none;background:none;color:var(--link);font-weight:700;cursor:pointer;min-height:44px;padding:0 8px}
.checker{display:grid;grid-template-columns:repeat(6,10px);grid-template-rows:repeat(2,10px)}
.checker i.k{background:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{font-size:13px;line-height:18px;color:var(--muted);text-align:center}
.err{color:var(--stop);font-weight:600;font-size:15px}
.note{background:var(--tint);border-radius:16px;padding:12px 14px;font-size:15px;line-height:22px}
.spacer{height:8px}
</style>

<div class="app" id="app"></div>
<input type="file" id="photo" accept="image/*" capture="environment" hidden>
<input type="file" id="upload" accept="image/*" hidden>

<script>
/* ---------- Verified dashboard-light content (review before testing) ---------- */
const LIGHTS = [
  { id:"tpms", name:"Low tire pressure", level:"soon",
    looks:"Horseshoe shape (a tire cross-section) with an exclamation point inside",
    facts:"Steady light: one or more tires is low on air. Check all four with a tire gauge and fill to the PSI on the sticker inside the driver's door frame (not the number on the tire). If it flashes for about a minute when the car starts and then stays on, the tire-pressure sensor system has a problem: have a shop check it. Cold weather often makes this light come on.",
    first:"Got it, the low tire pressure light. Is it steady, or did it flash for about a minute when you started the car?",
    quick:["It's steady","It flashed first","A tire looks flat"] },
  { id:"check_engine", name:"Check engine", level:"soon",
    looks:"Outline of an engine block, sometimes with the word CHECK",
    facts:"Steady light: the car found an engine or emissions problem. Get it checked soon; many auto parts stores read the code for free. A loose gas cap is a common cause: tighten it until it clicks; the light can take a few drives to go off. Flashing light: a serious engine problem (often a misfire) that can damage the car. Slow down, avoid hard acceleration, and get it to a shop as soon as possible, or pull over when safe and call for help if the car runs badly.",
    first:"Okay, the check engine light. Is it steady or flashing? And is the car driving any differently?",
    quick:["Steady, drives fine","It's flashing","Could it be my gas cap?"] },
  { id:"oil_pressure", name:"Oil pressure", level:"stop",
    looks:"An old-style oil can with a drip coming out of the spout",
    facts:"The engine may not be getting enough oil pressure. Driving can quickly destroy the engine. Pull over when safe, turn off the engine, and do not keep driving with the light on. Once the engine has cooled for about 10 minutes, the oil level can be checked with the dipstick, but low oil pressure can have other causes, so call roadside help or a mechanic before driving." },
  { id:"coolant_temp", name:"Engine temperature", level:"stop",
    looks:"A thermometer standing in wavy lines (liquid)",
    facts:"The engine is overheating. Pull over when safe and turn off the engine. Never open the radiator or coolant cap while the engine is hot: the coolant is under pressure and can cause severe burns. Wait at least 30 minutes. If steam is coming from under the hood, stay away from it. Call roadside help or a mechanic before driving again." },
  { id:"battery", name:"Battery / charging", level:"stop",
    looks:"A rectangle battery with a plus and a minus sign",
    facts:"The charging system is not working, so the car is running on battery power and may stop running soon. Turn off things you don't need (radio, heated seats, extra chargers). If you're close, drive straight to a shop or safe place; if not, pull over somewhere safe and call for help." },
  { id:"high_beam", name:"High beams on", level:"info",
    looks:"Blue headlight shape (like a capital D) with straight lines going out to the side",
    facts:"Your high beams are on. That's fine on dark empty roads. Switch to regular headlights when another car is coming toward you or you're following someone, so you don't blind them. The headlight stalk is usually on the left of the steering wheel: push or pull it to switch.",
    first:"That blue light just means your high beams are on. Nothing is wrong with the car. Want to know how to switch them off?",
    quick:["How do I turn them off?","When should I use them?"] }
];

const TOPICS = ["A light came on","Tire looks low or flat","Something's leaking","A weird noise","Smoke or a burning smell","Car won't start","Brakes feel off"];
const LEVEL = { stop:"Stop soon", soon:"Check soon", info:"FYI", unsure:"Still figuring out" };

/* ---------- Icons ---------- */
const S = (inner, sw=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const SYM = {
  tpms:S('<path d="M6 6c-2 3-2 9 0 12M18 6c2 3 2 9 0 12"/><path d="M7 17h10"/><path d="M12 8v5M12 15.5v.5"/>'),
  check_engine:S('<path d="M4 10h2V8h4V6h4v2h3l2 2h1v6h-1l-2 2H8l-2-2H4z"/><path d="M2 11v4"/>'),
  oil_pressure:S('<path d="M3 11h9l4-3 5 2-5 1-3 5H5z"/><path d="M8 11V8h3"/><path d="M20 14c0 1-1 2-1 2s-1-1-1-2 1-2 1-2 1 1 1 2z"/>'),
  coolant_temp:S('<path d="M12 4v9"/><circle cx="12" cy="16" r="2.5"/><path d="M12 6h3M12 9h3"/><path d="M3 19c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/>'),
  battery:S('<rect x="3" y="7" width="18" height="12" rx="2"/><path d="M7 7V5M17 7V5"/><path d="M6 13h3M15 13h3M16.5 11.5v3"/>'),
  high_beam:S('<path d="M13 6c4 0 7 2.5 7 6s-3 6-7 6z"/><path d="M3 8h7M3 12h7M3 16h7"/>')
};
const SHAPE = {
  stop:'<svg viewBox="0 0 28 28" aria-hidden="true"><polygon points="8.2,1 19.8,1 27,8.2 27,19.8 19.8,27 8.2,27 1,19.8 1,8.2" fill="currentColor"/></svg>',
  soon:'<svg viewBox="0 0 28 28" aria-hidden="true"><polygon points="14,2 27,26 1,26" fill="#F2B705" stroke="#231930" stroke-width="2.5" stroke-linejoin="round"/></svg>',
  info:'<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="currentColor"/></svg>',
  unsure:'<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="4 4"/></svg>'
};
const I = {
  back:S('<path d="M19 12H5M11 6l-6 6 6 6"/>',2.2),
  cam:S('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',2.2),
  img:S('<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',2),
  send:S('<path d="M12 19V5M6 11l6-6 6 6"/>',2.4),
  stop:S('<rect x="7" y="7" width="10" height="10" rx="2"/>',2.4),
  chev:S('<path d="M6 9l6 6 6-6"/>',2.2)
};
const BEAR = `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="32" cy="32" r="16" fill="#B997F8"/><circle cx="88" cy="32" r="16" fill="#B997F8"/><circle cx="32" cy="32" r="7" fill="#FF7044"/><circle cx="88" cy="32" r="7" fill="#FF7044"/><rect x="14" y="32" width="92" height="76" rx="30" fill="#B997F8"/><circle cx="44" cy="60" r="5" fill="#231930"/><circle cx="76" cy="60" r="5" fill="#231930"/><ellipse cx="60" cy="69" rx="6" ry="4" fill="#231930"/><path d="M30 80 Q60 96 90 80" fill="none" stroke="#231930" stroke-width="5" stroke-linecap="round"/><rect x="86" y="79" width="9" height="17" rx="4.5" fill="#FF7044" stroke="#231930" stroke-width="2.5"/></svg>`;

/* ---------- State ---------- */
let sample = null, canImages = false, ready = false;
const st = { screen:"home", turns:[], topic:"", level:"unsure", light:null, quick:[], busy:false, error:"", ctl:null, pending:null };
const app = document.getElementById("app");
const byId = id => LIGHTS.find(l => l.id === id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chip = level => `<span class="chip ${level}">${SHAPE[level]}${LEVEL[level]}</span>`;

/* ---------- Screens ---------- */
function home(){
  const ai = !!sample, photos = ai;
  return `
  <div class="top" style="justify-content:space-between">
    <div class="brand">${BEAR}<span>Bear With Me</span></div>
    <div class="checker" aria-hidden="true">${Array.from({length:12},(_,i)=>`<i class="${(i+Math.floor(i/6))%2?"":"k"}"></i>`).join("")}</div>
  </div>
  <h1>Something going on with your car?</h1>
  <p class="muted">Show me or tell me. We'll figure out your next step together.</p>
  ${photos ? `
    <div class="btns">
      <button class="btn lav" id="snap">${I.cam}Snap it</button>
      <button class="btn" id="up">${I.img}Upload</button>
    </div>
    <p class="hint" style="margin-top:-6px">Only when you're parked. Never while driving.</p>` : ""}
  ${ai ? `
    <form class="describe" id="descForm">
      <label class="sr" for="desc">Describe what's happening</label>
      <input id="desc" type="text" placeholder="Tell me what's happening" autocomplete="off">
      <button class="round send" aria-label="Ask the bear">${I.send}</button>
    </form>
    <div class="stack">
      <div class="label">Or start with</div>
      <div class="topics">${TOPICS.map(t=>`<button data-topic="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    </div>` : (ready ? `<div class="note">Photo and chat help aren't available in this view. You can still look up a dashboard light below.</div>` : "")}
  ${st.error ? `<p class="err">${esc(st.error)}</p>` : ""}
  <details class="lightsbox" ${ai ? "" : "open"}>
    <summary><span>Look up a dashboard light</span><span style="width:22px;height:22px">${I.chev}</span></summary>
    <div class="lights">
      ${LIGHTS.map(l => `<button class="light" data-pick="${l.id}"><span class="sym">${SYM[l.id]}</span><b>${esc(l.name)}</b>${chip(l.level)}</button>`).join("")}
    </div>
  </details>
  <p class="hint">The bear can get things wrong. If you ever feel unsafe, call 911.</p>
  <div class="spacer"></div>`;
}

function stopBanner(){
  return `<div class="banner" role="alert">
    <div class="bt">${SHAPE.stop.replace('fill="currentColor"','fill="#FFFFFF"')}Stop soon</div>
    <ol>
      <li>Pull over as soon as it's safe.</li>
      <li>Turn off the engine and turn on your hazard lights.</li>
      <li>Don't keep driving until someone checks it.</li>
    </ol>
    <p>Roadside help: check your insurance card in My Important Stuff. In danger, smoke or fire? Get away from the car and call <b>911</b>.</p>
  </div>`;
}

function chat(){
  const msgs = st.turns.map(t => {
    if (t.role === "user") return `<div class="msg me">${t.photoUrl ? `<img src="${t.photoUrl}" alt="Your photo">` : ""}${esc(t.display ?? t.content)}</div>`;
    return `<div class="msg bot${t.think?" think":""}">${esc(t.display ?? t.content)}</div>`;
  }).join("");
  const photos = !!sample;
  return `
  <div class="head">
    <div class="headrow">
      <button class="round" id="home" aria-label="Start over">${I.back}</button>
      <span style="width:36px;height:36px;flex:none">${BEAR}</span>
      <div class="t"><b>${esc(st.topic || "Ask the bear")}</b>${chip(st.level)}</div>
    </div>
    ${st.level === "stop" ? stopBanner() : ""}
  </div>
  <div class="chat" id="chatlog">${msgs}</div>
  ${st.quick.length && !st.busy ? `<div class="quick">${st.quick.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}
  ${st.error ? `<p class="err">${esc(st.error)}</p>` : ""}
  ${sample ? `
  <div class="composer">
    ${st.pending ? `<div class="pending"><img src="${st.pending.url}" alt="Photo to send"><span>Photo ready to send</span><button id="unpend">Remove</button></div>` : ""}
    <form id="chatForm">
      ${photos ? `<button type="button" class="round" id="addPhoto" aria-label="Add a photo" style="background:var(--tint);border-color:var(--tint)">${I.cam}</button>` : ""}
      <label class="sr" for="msg">Message</label>
      <input id="msg" type="text" placeholder="${st.pending ? "Add a note (optional)" : "Type a reply"}" autocomplete="off" ${st.busy?"disabled":""}>
      ${st.busy ? `<button type="button" class="round" id="halt" aria-label="Stop">${I.stop}</button>`
                : `<button class="round send" aria-label="Send">${I.send}</button>`}
    </form>
    <p class="hint">The bear can get things wrong. A mechanic and your owner's manual have the final word.</p>
  </div>` : `<div class="note">${st.light ? esc(st.light.facts) : ""}</div><div class="spacer"></div>`}`;
}

/* ---------- Render + events ---------- */
let photoTarget = "new", photosBlocked = false;
const NO_PHOTOS = "Photos can't be sent to the bear from where this page is open right now. Try opening the link in the Claude mobile app or claude.ai in a web browser. You can still describe what you see in words.";
function render(){
  app.innerHTML = st.screen === "chat" ? chat() : home();
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  const pick = (target, input) => () => {
    if (photosBlocked) { st.error = NO_PHOTOS; render(); return; }
    photoTarget = target; document.getElementById(input).click();
  };
  on("snap", pick("new", "photo"));
  on("up", pick("new", "upload"));
  on("addPhoto", pick("chat", "upload"));
  on("unpend", () => { st.pending = null; render(); });
  on("home", () => { st.ctl?.abort(); st.screen = "home"; st.error = ""; st.pending = null; render(); window.scrollTo(0,0); });
  on("halt", () => st.ctl?.abort());
  app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => startLight(byId(b.dataset.pick)));
  app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => start(b.dataset.topic, null));
  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => send(b.dataset.q));
  const df = document.getElementById("descForm");
  if (df) df.onsubmit = e => { e.preventDefault(); const t = document.getElementById("desc").value.trim(); if (t) start(t, null); };
  const cf = document.getElementById("chatForm");
  if (cf) cf.onsubmit = e => { e.preventDefault(); const i = document.getElementById("msg"); const t = i.value.trim(); if (t || st.pending) { i.value = ""; send(t); } };
  if (st.screen === "chat") document.getElementById("chatlog")?.lastElementChild?.scrollIntoView({block:"nearest"});
}

for (const id of ["photo","upload"]) {
  document.getElementById(id).onchange = e => {
    const f = e.target.files?.[0]; e.target.value = "";
    if (!f) return;
    const pic = { file:f, url:URL.createObjectURL(f) };
    if (photoTarget === "chat" && st.screen === "chat") { st.pending = pic; render(); }
    else start("", pic);
  };
}

/* ---------- Conversation ---------- */
function reset(){ st.ctl?.abort(); Object.assign(st, { screen:"chat", turns:[], topic:"", level:"unsure", light:null, quick:[], busy:false, error:"", pending:null }); }

function start(text, pic){
  reset();
  st.pending = pic;
  send(text);
}

function startLight(l){
  reset();
  st.light = l; st.topic = l.name; st.level = l.level;
  const first = l.level === "stop"
    ? "Do the steps above first. Once you're stopped somewhere safe, tell me what's happening and I'll help with what comes next."
    : l.first;
  st.turns.push({ role:"assistant", content:first });
  st.quick = l.level === "stop" ? ["I've pulled over","I'm on the highway","What could cause this?"] : l.quick;
  render(); window.scrollTo(0,0);
}

function rules(){
  return `You are "the bear", the friendly guide inside Bear With Me: The Ready Kit, a car-preparedness kit for beginners (mostly women 18-40 who are new to car care). You help with ANY car problem: warning lights, tires, leaks, noises, smells, smoke, dents and damage, fluids, batteries, brakes, things that won't start or won't work. The driver may send photos and will describe what's happening. Your job: understand the problem, judge how urgent it is, explain it in plain words, and give a safe next step.
${st.light ? `\nThe driver picked this dashboard light from a verified list: ${st.light.name}. Verified facts (trust these over your own knowledge): ${st.light.facts}\n` : ""}
Their kit has: a tire pressure gauge, a small flashlight, a pen, a document sleeve with registration and insurance, and an illustrated guidebook.

How to help:
- When they first send a photo, start by saying briefly what you can actually see, and ask if that's right. Never pretend to see details you can't. If the photo is unclear, say so and ask for another angle, more light, or a description.
- Work it out like a calm, knowledgeable friend: ask ONE clarifying question at a time (when it started, steady or flashing, color and smell of a leak, when the noise happens, how the car drives).
- Talk about likely causes as possibilities ("this could be..."), never a certain diagnosis. You can't hear sounds or smell: ask them to describe.
- Only suggest beginner-safe steps: looking, checking tire pressure, checking fluid levels with the engine off and cool, tightening a gas cap, reading the owner's manual. Anything involving brakes, steering, airbags, fuel leaks, electrical work, getting under the car, or lifting it goes to a mechanic or roadside help.
- Never: open a hot radiator or coolant cap, work under a car held up only by a jack, touch a cracked, leaking or hissing battery, or guess at specs; point them to the owner's manual or door sticker for numbers.
- Never say it's fine to keep driving with: a red warning light, a flashing check engine light, overheating, steam or smoke, a burning or fuel smell, brake problems (grinding, soft or sinking pedal, pulling hard), steering problems, a flat or badly damaged tire, or fluid pouring out.
- Emergencies first: smoke, fire, fuel smell, a crash, being stuck in traffic lanes, feeling unsafe, or someone hurt means: get to safety and call 911 before anything else.
- If they seem to be driving, tell them to wait until they're parked.
- If the question isn't about a car, gently bring it back.

Style: plain words, no jargon (explain any car word you must use), no markdown symbols. Two to five short sentences; numbered steps only when giving 2-4 steps. Warm, encouraging, lightly playful when the situation is minor; calm and direct with no jokes when it's serious. End with one clear next step or one question.

After your message, add exactly these three lines, in this order, and nothing after them:
URGENCY: stop | soon | info | unsure
TOPIC: a 2-5 word name for the problem
SUGGESTIONS: 2-3 short replies the driver might tap, separated by " | " (max 6 words each)
URGENCY meanings: stop = pull over / don't drive / get help now; soon = get it looked at in the next few days; info = no problem or routine; unsure = not enough information yet.`;
}

const META = /\n\s*(URGENCY|TOPIC|SUGGESTIONS)\s*:/i;
function visible(text){
  let t = text.split(META)[0];
  t = t.replace(/\n\s*(U|UR|URG\w*|T|TO|TOP\w*|S|SU|SUG\w*)$/i, "");
  return t.trim();
}
function meta(text, key){
  const m = text.match(new RegExp(`^\\s*${key}\\s*:\\s*(.+)$`, "im"));
  return m ? m[1].trim() : "";
}

async function send(text){
  if (!sample || st.busy) return;
  const pic = st.pending; st.pending = null;
  const shown = text || (pic ? "" : "");
  let content = text || "";
  if (pic) content = (content ? content + "\n\n" : "") + "[I attached a photo of the problem.]";
  if (!content) return;
  st.turns.push({ role:"user", content, display: shown, photoUrl: pic?.url });
  const ctl = st.ctl = new AbortController();
  st.busy = true; st.error = ""; st.quick = [];
  const bot = { role:"assistant", content:"", display: pic ? "Taking a look…" : "Thinking…", think:true };
  st.turns.push(bot);
  render();

  // Only the newest photo is sent; earlier photos are referenced by the bear's own description.
  const history = st.turns.filter(t => t !== bot).slice(-14).map(t => ({ role:t.role, content:t.content }));
  const input = [{ role:"user", content: rules() }];
  if (history[0]?.role === "assistant") input.push({ role:"user", content:"(I opened the chat.)" });
  input.push(...history);

  const opts = { signal: ctl.signal, cache:false, onText: ({text}) => {
    const v = visible(text);
    if (v) { bot.display = v; bot.think = false; const el = document.getElementById("chatlog")?.lastElementChild; if (el) { el.textContent = v; el.classList.remove("think"); el.scrollIntoView({block:"nearest"}); } }
  }};
  if (pic) opts.images = pic.file;

  try {
    const { text: full } = await sample(input, opts);
    const reply = visible(full) || "Sorry, I lost my train of thought. Could you say that again?";
    bot.content = reply; bot.display = reply; bot.think = false;
    const lv = meta(full, "URGENCY").toLowerCase().split(/[^a-z]/)[0];
    if (LEVEL[lv]) {
      // Urgency only escalates automatically; it calms down only on a clear "info" call.
      const rank = { info:0, unsure:1, soon:2, stop:3 };
      if (rank[lv] >= rank[st.level] || lv === "info" || st.level === "unsure") st.level = lv;
    }
    const tp = meta(full, "TOPIC"); if (tp && !st.light) st.topic = tp.slice(0, 40);
    st.quick = meta(full, "SUGGESTIONS").split("|").map(s => s.trim()).filter(Boolean).slice(0,3);
  } catch (e) {
    const code = e?.code;
    if (code === "cancelled") {
      if (e.text && visible(e.text)) { bot.content = bot.display = visible(e.text); bot.think = false; }
      else st.turns.pop();
    } else {
      st.turns.pop(); st.turns.pop();
      if (pic) st.pending = pic;
      st.error = ({
        not_granted:"Claude help isn't allowed here, so the chat is off.",
        sampling_disabled:"Claude help isn't available on this account.",
        rate_limited:"Too many messages in a row. Wait a minute and try again.",
        image_rejected:"That photo couldn't be read. Try a JPEG or PNG, a little closer.",
        images_unavailable:NO_PHOTOS,
        refused:"I can't help with that one. Try asking another way."
      })[code] || "That didn't go through. Check your signal and try again.";
      if (code === "not_granted" || code === "sampling_disabled") sample = null;
      if (code === "images_unavailable") { canImages = false; photosBlocked = true; st.pending = null; }
      if (!st.turns.length) { st.screen = "home"; }
    }
  } finally {
    st.busy = false; render();
  }
}

/* ---------- Boot ---------- */
render();
(async () => {
  try {
    sample = await window.claude?.use?.("sample") ?? null;
    if (sample) { const caps = await sample.limits().catch(() => null); canImages = !!caps?.images; }
  } catch { sample = null; }
  ready = true; render();
})();
</script>
